<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIGN DSP - Versão Definitiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0d0e12;
            --bg-card: #161820;
            --accent: #deff9a;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            
            --color-sub: #ff5722;
            --color-low: #ffc107;
            --color-mid: #2196f3;
            --color-high: #9c27b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Urbanist', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--bg-card);
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        h1 { font-size: 24px; font-weight: 700; }
        h1 span { color: var(--accent); }

        .controls-top {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover { transform: translateY(-1px); opacity: 0.9; }
        .btn-secondary { background: #2c2c35; color: var(--text-main); }
        .btn-danger { background: #ff3b30; color: #fff; }

        .status {
            font-size: 14px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Grid de Delay das 30 Bandas (Disposição Horizontal Homogénea) */
        .matrix-container {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .band-row {
            background: #1c1e27;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid #fff;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .band-row.sub { border-left-color: var(--color-sub); }
        .band-row.low { border-left-color: var(--color-low); }
        .band-row.mid { border-left-color: var(--color-mid); }
        .band-row.high { border-left-color: var(--color-high); }

        .band-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .band-title {
            font-size: 12px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .control-pack {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Inputs Numéricos */
        .delay-input {
            width: 54px;
            background: #0d0e12;
            border: 1px solid #3a3a4c;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-align: center;
            padding: 3px 0;
            border-radius: 4px;
        }

        .delay-input::-webkit-inner-spin-button, 
        .delay-input::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Sliders Horizontais Nativos Robustos */
        .fader-horizontal {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #2d3142;
            border-radius: 3px;
            cursor: pointer;
        }

        .fader-horizontal::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-main);
        }

        /* Painel Macroscópico de Grupos */
        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .group-card {
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 12px;
            border-top: 4px solid #fff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .group-card.sub { border-top-color: var(--color-sub); }
        .group-card.low { border-top-color: var(--color-low); }
        .group-card.mid { border-top-color: var(--color-mid); }
        .group-card.high { border-top-color: var(--color-high); }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .group-slider-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .group-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: #232530;
            border-radius: 2px;
            cursor: pointer;
        }

        .group-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-main);
        }

        .btn-reset-small {
            background: #2c2c35;
            color: var(--text-muted);
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: all 0.2s;
        }

        .btn-reset-small:hover { background: #ff3b30; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>ALIGN <span>DSP</span></h1>
        <div class="controls-top">
            <input type="file" id="audio-file" accept="audio/*" style="display: none;">
            <button class="btn" onclick="document.getElementById('audio-file').click()">
                <i class="fa-solid fa-folder-open"></i> CARREGAR ÁUDIO
            </button>
            <button class="btn btn-secondary" id="play-btn">
                <i class="fa-solid fa-play"></i> PLAY
            </button>
            <button class="btn btn-danger" onclick="resetAll()">
                <i class="fa-solid fa-rotate-left"></i> ZERAR DELAYS
            </button>
            <div class="status" id="status">Aguardando ficheiro...</div>
        </div>
    </header>

    <main>
        <div class="matrix-container" id="matrix-grid"></div>

        <div class="groups-container">
            <div class="group-card sub">
                <div class="group-header" style="color: var(--color-sub);">
                    <span>GRUPO SUB (25Hz - 80Hz)</span>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="val-sub">0.0 ms</span>
                        <button class="btn-reset-small" onclick="resetGroup('sub')" title="Zerar Grupo Sub"><i class="fa-solid fa-undo"></i></button>
                    </div>
                </div>
                <div class="group-slider-wrap">
                    <input type="range" id="slider-sub" min="-50" max="50" value="0" step="0.1" class="group-slider" oninput="updateGroup('sub', this.value)">
                </div>
            </div>

            <div class="group-card low">
                <div class="group-header" style="color: var(--color-low);">
                    <span>GRUPO LOW-MID (100Hz - 400Hz)</span>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="val-low">0.0 ms</span>
                        <button class="btn-reset-small" onclick="resetGroup('low')" title="Zerar Grupo Low"><i class="fa-solid fa-undo"></i></button>
                    </div>
                </div>
                <div class="group-slider-wrap">
                    <input type="range" id="slider-low" min="-50" max="50" value="0" step="0.1" class="group-slider" oninput="updateGroup('low', this.value)">
                </div>
            </div>

            <div class="group-card mid">
                <div class="group-header" style="color: var(--color-mid);">
                    <span>GRUPO MID (500Hz - 4kHz)</span>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="val-mid">0.0 ms</span>
                        <button class="btn-reset-small" onclick="resetGroup('mid')" title="Zerar Grupo Mid"><i class="fa-solid fa-undo"></i></button>
                    </div>
                </div>
                <div class="group-slider-wrap">
                    <input type="range" id="slider-mid" min="-50" max="50" value="0" step="0.1" class="group-slider" oninput="updateGroup('mid', this.value)">
                </div>
            </div>

            <div class="group-card high">
                <div class="group-header" style="color: var(--color-high);">
                    <span>GRUPO HIGH (5kHz - 20kHz)</span>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="val-high">0.0 ms</span>
                        <button class="btn-reset-small" onclick="resetGroup('high')" title="Zerar Grupo High"><i class="fa-solid fa-undo"></i></button>
                    </div>
                </div>
                <div class="group-slider-wrap">
                    <input type="range" id="slider-high" min="-50" max="50" value="0" step="0.1" class="group-slider" oninput="updateGroup('high', this.value)">
                </div>
            </div>
        </div>
    </main>

<script>
    const freqs = [25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500, 16000, 20000];
    
    const groups = {
        sub: [25, 31.5, 40, 50, 63, 80],
        low: [100, 125, 160, 200, 250, 315, 400],
        mid: [500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000],
        high: [5000, 6300, 8000, 10000, 12500, 16000, 20000]
    };

    let audioCtx, source, masterGain;
    let bands = [];
    
    // Arrays de Estado Isolados e Protegidos
    let manualDelays = new Array(freqs.length).fill(0);
    let groupOffsets = { sub: 0, low: 0, mid: 0, high: 0 };

    const grid = document.getElementById('matrix-grid');
    const playBtn = document.getElementById('play-btn');
    const status = document.getElementById('status');

    // Construção Dinâmica da Interface de Matriz Horizontal Estável
    freqs.forEach((f, i) => {
        const card = document.createElement('div');
        let groupClass = 'high';
        if (groups.sub.includes(f)) groupClass = 'sub';
        else if (groups.low.includes(f)) groupClass = 'low';
        else if (groups.mid.includes(f)) groupClass = 'mid';

        card.className = `band-row ${groupClass}`;
        card.innerHTML = `
            <div class="band-meta">
                <span class="band-title" style="color: var(--color-${groupClass})">${f < 1000 ? f + ' Hz' : (f/1000) + ' kHz'}</span>
                <div class="control-pack">
                    <input type="number" class="delay-input" id="delay-${i}" value="0.0" step="0.1" min="0" max="250">
                </div>
            </div>
            <input type="range" class="fader-horizontal" min="0" max="200" value="0" step="0.1" id="fader-${i}">
        `;
        grid.appendChild(card);
    });

    async function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
        
        freqs.forEach((f, i) => {
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = f;
            filter.Q.value = 4.31;

            const delay = audioCtx.createDelay(2.5); 
            delay.delayTime.value = 0;

            bands.push({ filter, delay, freq: f });

            // Evento estável de arrasto do slider horizontal
            document.getElementById(`fader-${i}`).addEventListener('input', (e) => {
                manualDelays[i] = parseFloat(e.target.value) || 0;
                processDataFlow(i, 'fader');
            });
            
            // Evento estável de introdução na caixa numérica
            document.getElementById(`delay-${i}`).addEventListener('change', (e) => {
                let inputVal = parseFloat(e.target.value) || 0;
                inputVal = Math.max(0, Math.min(250, inputVal));
                
                const group = getGroupName(f);
                // O valor digitado define o ponto final, adaptando a posição do fader em conformidade
                manualDelays[i] = Math.max(0, inputVal - groupOffsets[group]);
                
                processDataFlow(i, 'input');
            });
        });
    }

    function getGroupName(freq) {
        if (groups.sub.includes(freq)) return 'sub';
        if (groups.low.includes(freq)) return 'low';
        if (groups.mid.includes(freq)) return 'mid';
        return 'high';
    }

    // Fluxo de Processamento Unidirecional (Imutável, Sem Loops)
    function processDataFlow(i, origin) {
        const freq = freqs[i];
        const group = getGroupName(freq);
        
        // Cálculo Real Consolidado: Valor Próprio da Banda + Offset de Deslocamento do Grupo
        const calculatedTotal = Math.max(0, manualDelays[i] + groupOffsets[group]);

        // 1. Atualização Instantânea no Motor de Áudio
        if (audioCtx && bands[i]) {
            bands[i].delay.delayTime.setTargetAtTime(calculatedTotal / 1000, audioCtx.currentTime, 0.005);
        }

        // 2. Sincronização Estrita da Interface Visual
        const inputField = document.getElementById(`delay-${i}`);
        const faderField = document.getElementById(`fader-${i}`);

        inputField.value = calculatedTotal.toFixed(1);

        if (origin !== 'fader') {
            faderField.value = manualDelays[i].toFixed(1);
        }
    }

    // Controlo de Alteração do Grupo Macro
    window.updateGroup = (group, val) => {
        const parsedVal = parseFloat(val);
        groupOffsets[group] = parsedVal;
        
        document.getElementById(`val-${group}`).innerText = `${parsedVal > 0 ? '+' : ''}${parsedVal.toFixed(1)} ms`;
        
        freqs.forEach((f, i) => {
            if (groups[group].includes(f)) {
                processDataFlow(i, 'group');
            }
        });
    };

    window.resetGroup = (group) => {
        document.getElementById(`slider-${group}`).value = 0;
        window.updateGroup(group, 0);
    };

    window.resetAll = () => {
        ['sub', 'low', 'mid', 'high'].forEach(g => resetGroup(g));
        
        freqs.forEach((f, i) => {
            manualDelays[i] = 0;
            document.getElementById(`fader-${i}`).value = 0;
            processDataFlow(i, 'reset');
        });
    };

    document.getElementById('audio-file').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const url = URL.createObjectURL(file);
        const audio = new Audio(url);
        audio.loop = true;
        
        setupPlayer(audio);
    };

    function setupPlayer(audio) {
        initAudio();
        if (source) source.disconnect();
        
        source = audioCtx.createMediaElementSource(audio);
        
        bands.forEach(b => {
            source.connect(b.filter);
            b.filter.connect(b.delay);
            b.delay.connect(masterGain);
        });

        playBtn.onclick = () => {
            if (audio.paused) {
                audioCtx.resume();
                audio.play();
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i> PAUSE';
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i> PLAY';
            }
        };
        
        status.innerText = "Faders horizontais nativos ativos. Pronto.";
    }
</script>
</body>
</html>
